name: CI (Windows)

on:
  push:
    branches: [main, "claude/**"]
    # ビルドに関係するファイルが変わったときだけ実行する
    paths:
      - "core/**"
      - "gui/**"
      - "app/**"
      - "scripts/**"
      - "packaging/**"
      - "mise.toml"
      - ".github/workflows/ci-windows.yml"
  pull_request:
    paths:
      - "core/**"
      - "gui/**"
      - "app/**"
      - "scripts/**"
      - "packaging/**"
      - "mise.toml"
      - ".github/workflows/ci-windows.yml"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # MSVCの環境(cl, link, lib)を有効にする
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Odinのバージョン(mise.tomlで固定)
        id: odin
        run: echo "version=$(scripts/odin-version.sh)" >> "$GITHUB_OUTPUT"
      - uses: laytan/setup-odin@v2
        with:
          release: ${{ steps.odin.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: セットアップ
        run: scripts/setup.sh
      - name: ビルド
        run: scripts/build.sh release
      - name: CLIの単体テスト
        run: odin test app -collection:sokol=.tools/sokol-odin/sokol -extra-linker-flags:"/LIBPATH:build/core" -out:build/apptest.exe
      - name: 動作確認（ウィンドウ無しで実行）
        run: build/bin/BubiZ-2500.exe -headless 60 -nosound
      - name: コアの煙テスト
        run: build/core/bubiz_smoke.exe "$RUNNER_TEMP/"
      - name: 配布物の作成(zip)
        run: scripts/package-windows.sh
      - name: 配布物の名前
        id: artifact
        run: echo "name=$(scripts/artifact-name.sh)" >> "$GITHUB_OUTPUT"
      - name: 配布物のアップロード
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
