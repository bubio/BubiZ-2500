name: CI

on:
  push:
    branches: [main]
    # ビルドに関係するファイルが変わったときだけ実行する
    paths:
      - "core/**"
      - "app/**"
      - "scripts/**"
      - "mise.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "core/**"
      - "app/**"
      - "scripts/**"
      - "mise.toml"
      - ".github/workflows/ci.yml"

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 依存パッケージ
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake llvm-18-dev clang-18 libgl-dev libasound2-dev libx11-dev libxi-dev libxcursor-dev
      - name: Odinをビルド
        run: |
          git clone --depth 1 https://github.com/odin-lang/Odin "$HOME/odin"
          cd "$HOME/odin"
          LLVM_CONFIG=llvm-config-18 CXX=clang++-18 ./build_odin.sh release
          echo "$HOME/odin" >> "$GITHUB_PATH"
      - name: セットアップ
        run: scripts/setup.sh
      - name: ビルド
        run: scripts/build.sh release
      - name: CLIの単体テスト
        run: odin test app -collection:sokol=.tools/sokol-odin/sokol -extra-linker-flags:"-Lbuild/core" -out:build/apptest
      - name: 動作確認（ウィンドウ無しで実行）
        run: build/bin/bubiz -headless 60 -nosound
      - name: コアの煙テスト
        run: |
          g++ -std=gnu++17 -Icore core/tests/smoke.cpp build/core/libbubiz_core.a -lpthread -o build/smoke
          build/smoke "$RUNNER_TEMP/"
