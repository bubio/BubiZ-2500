name: Release (Windows)

# release.yml から呼ばれる。単体でも手動実行できる(配布物をartifactとして得るだけで公開はしない)
on:
  workflow_call:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # MSVCの環境(cl, link, lib)を有効にする
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Odinのバージョン(mise.tomlで固定)
        id: odin
        run: echo "version=$(scripts/odin-version.sh)" >> "$GITHUB_OUTPUT"
      - uses: laytan/setup-odin@v2
        with:
          release: ${{ steps.odin.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: セットアップ
        run: scripts/setup.sh
      - name: ビルド
        run: scripts/build.sh release
      - name: 動作確認
        run: build/bin/BubiZ-2500.exe -headless 60 -nosound
      - name: 配布物の作成(zip)
        run: scripts/package-windows.sh
      - name: 配布物の名前
        id: artifact
        run: echo "name=$(scripts/artifact-name.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.artifact.outputs.name }}
          path: dist/*
          if-no-files-found: error
